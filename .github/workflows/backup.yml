name: Daily Database Backup

# Runs automatically every day, independent of Render or the app itself
# being healthy — a backup system that depends on the thing it's
# backing up being fine defeats the point. This runs on GitHub's own
# infrastructure, on a schedule, with no manual step required.
#
# Setup (one-time): add a repository secret named DATABASE_URL with
# your Neon connection string, at:
#   GitHub repo -> Settings -> Secrets and variables -> Actions
#   -> New repository secret
# This is a SEPARATE secret from the one in Render — GitHub Actions
# cannot see Render's environment variables, so it needs its own copy.
#
# Also confirm (one-time): Settings -> Actions -> General ->
# Workflow permissions -> "Read and write permissions" is selected,
# so this workflow is allowed to commit the backup file back to the repo.

on:
  schedule:
    - cron: "0 2 * * *" # every day at 02:00 UTC
  workflow_dispatch: {} # also allows manually triggering a backup any time from GitHub's Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "backups/backup-$(date +%Y-%m-%d).sql.gz"

      - name: Remove backups older than 30 days
        run: find backups -name "backup-*.sql.gz" -mtime +30 -delete

      - name: Commit and push the new backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Automated backup $(date +%Y-%m-%d)"
          git push
