<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Zichri School</title>
<meta name="theme-color" content="#1d4ed8" />

<!-- Makes the site installable as an app (PWA) — "Add to Home Screen" -->
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zichri School" />

<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="app"><div class="spinner" style="margin-top:120px;"></div></div>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {
        // Installability is a nice-to-have, not a requirement — if this
        // fails for any reason, the app itself still works completely
        // normally in a regular browser tab.
      });
    });
  }
</script>
</body>
</html>
